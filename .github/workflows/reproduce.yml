name: Reproducible extraction
on:
  push:
  pull_request:
  workflow_dispatch: {}
jobs:
  reproduce:
    runs-on: ubuntu-22.04   # Poppler 22.02.0 — the pinned toolchain for byte-exact PDF extraction
    permissions:
      contents: write       # used ONLY by the workflow_dispatch attestation refresh at the end
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # (d) ASSERT, DON'T RELY ON THE IMAGE (issue #7). The pin above is enforced by `runs-on:
      # ubuntu-22.04`, not by this install step — but that enforcement has an expiry: GitHub retires
      # image labels, and package revisions move within a label (this job currently gets
      # poppler-utils 22.02.0-2ubuntu0.13, a revision of the pinned version). If the toolchain moves,
      # every historical MISMATCH silently becomes ambiguous between "the record changed" and "the
      # runner changed" — which is exactly how a locally-built Poppler 26.01.0 produced a spurious
      # mismatch on an untouched record. This step makes such a move a LOUD, DATED failure instead.
      # It reads the pin from extract.py so there is one source of truth, not a copy in YAML.
      # TARGET (issue #7): pin by container, so the job tests the recorded toolchain explicitly.
      - name: Assert the toolchain is the PINNED one (fail closed if the runner moves)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import extract as E
          ver = E.poppler_version()
          print(f"pdftotext (Poppler) {ver}  ·  pinned {E.PINNED_POPPLER}")
          if ver != E.PINNED_POPPLER:
              sys.exit(f"FAIL: the runner's Poppler is {ver}, but this corpus pins {E.PINNED_POPPLER}. "
                       "Byte-exact reproduction of PDF-sourced records is guaranteed only against the "
                       "pinned version, so every MISMATCH below would be ambiguous between 'the record "
                       "changed' and 'the toolchain moved'. Pin this job to an image carrying the pinned "
                       "Poppler (issue #7), or re-derive the affected records deliberately and move the "
                       "pin in the same change.")
          # (e) PER-RECORD ATTESTATIONS, where they exist (issue #7). Each must name the toolchain
          # actually running here, or a CI result cannot be read per record. This is the check that
          # makes a toolchain move name the affected records instead of silently restating them.
          import glob, json
          files = sorted(glob.glob("extraction/**/*.json", recursive=True))
          bad = []
          for f in files:
              try:
                  d = json.load(open(f, encoding="utf-8"))
              except Exception:
                  bad.append((f, "unreadable")); continue
              tc = (d.get("extractor") or {}).get("toolchain")
              if tc and tc != f"poppler {ver}":
                  bad.append((d.get("corpus_id", f), tc))
          if bad:
              sys.exit("FAIL: attestation(s) name a toolchain other than this runner's: "
                       + "; ".join(f"{c} -> {t}" for c, t in bad)
                       + ". A stale attestation makes that record's reproduction unverifiable. "
                         "Re-derive the record deliberately and refresh its attestation in the SAME "
                         "change, or pin the job to the toolchain it was attested under (issue #7).")
          print(f"OK: {len(files)} per-record attestation(s), all naming poppler {ver}."
                if files else
                "NOTE: this corpus carries no per-record attestations yet — the global pin above is "
                "the only guard. Run this workflow manually to author them (issue #7, option e).")
          print("OK: toolchain matches the pin — so a MISMATCH below means the RECORD changed.")
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Reproducibility gate — every record reproduced or declared, nothing unaccounted for
        # Was `python3 scripts/extract.py`, which aborted on the first record without a committed
        # extractor (the OCR-derived ITLOS order) and took 27 passing records' results down with
        # it. The gate walks authoritative/ as its denominator, applies scripts/repro-policy.json,
        # and fails only on a real mismatch, an extractor error, or an uncovered record beyond the
        # ratchet — so a genuinely non-reproducible record is declared, not fatal-on-sight.
        run: python3 scripts/repro_gate.py
      # (e) AUTHOR the attestations, UNDER THE PINNED TOOLCHAIN (issue #7 option e). This is
      # deliberately workflow_dispatch-only: authoring is only honest where the pinned toolchain runs,
      # and a normal push run must not create commits. Run manually to author or refresh; the assert
      # above keeps them honest on every other run.
      - name: Refresh per-record toolchain attestations
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/extract.py --attest
      - name: Commit refreshed attestations
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git add extraction
          if git diff --cached --quiet; then echo "no attestation changes"; exit 0; fi
          git commit -m "chore(attest): refresh per-record toolchain attestations"
          git push
