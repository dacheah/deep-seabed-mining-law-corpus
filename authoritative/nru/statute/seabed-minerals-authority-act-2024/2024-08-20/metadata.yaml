provenance_note: 'SCOPE (issue #13, ruled 2026-09-17): sponsoring-State national law. SOURCING: located
  through the ISA''s National Legislation Database, which reproduces State submissions in the form and
  language received and does not edit them; the file is therefore the State''s own copy and not a database
  transcription (contrast JC-005). IDENTIFIER AND DATES: No. 13 of 2024, certified and commenced 20 August
  2024, both stated in the register''s legislative note carried with the copy - so both dates are the instrument''s
  own, not inferred. WHAT THE INSTRUMENT DOES: it establishes the Nauru Seabed Minerals Authority as the
  national body for sponsorship and regulation of activities in the Area, and it REPEALS the International
  Seabed Minerals Act 2015 at section 70. That repeal is why the 2015 record carries superseded_by pointing
  here: a reader who takes the 2015 text as the law in force would be reading repealed law, and the cross-reference
  is the correction. Regulations under it are recorded separately (see related_documents). THE TEXT: born-digital,
  no OCR. Recovered by the per-record cleaner in scripts/extract.py. Verified against the instrument''s
  own Table of Provisions: 70 sections, contiguous 1-70, zero gaps, the text ending at section 70 (Repeal),
  no page furniture retained, and no token in the text that is absent from the raw extraction.'
