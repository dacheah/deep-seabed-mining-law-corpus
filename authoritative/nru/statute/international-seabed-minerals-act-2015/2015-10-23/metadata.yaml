provenance_note: 'SCOPE (issue #13, ruled 2026-09-17): sponsoring-State national law is in scope, and national
  legislation of the States sponsoring contracts in the Area is the class this record belongs to. SOURCING,
  AND WHAT THE SOURCE IS: the text was located through the ISA''s National Legislation Database, which
  describes its own collection in these words - "The present collection of laws, regulations and administrative
  measures concerning activities in the Area is based on submissions made by the Member States. Accordingly,
  the texts are reproduced in the form and the language(s) received from the Member States and were not
  formally edited and/or translated by ISA." That statement is why the file is treated as the State''s
  own text and not as an ISA transcription - a database transcription is a step further from the authentic
  text and would have been recorded as such (cf. JC-005). The distinctive shape of the copy confirms it:
  RONLAW register furniture (page-stamp dates, a TABLE OF AMENDMENTS page). IDENTIFIER AND DATES: the
  Act''s own number is No. 26 of 2015 and the copy states "Certified: 23 October 2015"; no commencement
  date is stated on the face of the copy held, so entry_into_force_date is null rather than guessed (cf.
  JC-008: no invented identifiers or dates). WHAT THE INSTRUMENT DOES: it is Nauru''s first national seabed
  minerals statute - sponsorship certificates, the sponsoring State''s obligations under Article 139 and
  Annex III of the Convention, the environmental and reporting duties attaching to a sponsorship, and
  the powers of the Minister. It is REPEALED: see the 2024 Act in related_documents, which repeals it
  at section 70. THE TEXT: born-digital, so no OCR; recovered from the PDF text layer by the per-record
  cleaner in scripts/extract.py and stored as the corpus''s plain text. Verified against the instrument''s
  own Table of Provisions: 56 sections, contiguous 1-56, zero gaps, no page furniture retained, and no
  token present in the text that is not present in the raw extraction.'
