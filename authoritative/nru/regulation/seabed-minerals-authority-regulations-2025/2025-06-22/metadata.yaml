provenance_note: 'SCOPE (issue #13, ruled 2026-09-17): sponsoring-State national law, here the subsidiary
  legislation that makes the 2024 Act workable. SOURCING: located through the ISA''s National Legislation
  Database, which reproduces State submissions in the form and language received; the file is the State''s
  own copy, not a database transcription (contrast JC-005). IDENTIFIER AND DATES: SL No. 32 of 2025, notified
  22 June 2025 - the instrument''s own number and notification date, taken from its face. The maker is
  stated in the instrument itself: "The Cabinet makes the following Regulations under Section 68 of the
  Nauru Seabed Minerals Act 2024". THE TEXT, AND ONE TREATMENT DECISION WORTH READING: born-digital,
  no OCR. The body is numbered 1-62 and is assembled section by section, but the instrument ends in three
  SCHEDULEs of forms (sponsorship application requirements, compliance history statement, annual compliance
  statement). Assembly stops at the first SCHEDULE heading on purpose: a form prints its own item numbers,
  and those numbers carry on the section sequence, so reading them as sections minted a "Section 63" and
  a "Section 64" that do not exist in the instrument. Everything from the schedule heading on is retained
  exactly as printed, line by line, so no wording is lost - a schedule is part of the instrument, only
  its numbering is not section numbering. Verified against the instrument''s own Table of Provisions:
  62 sections, contiguous 1-62, zero gaps, no page furniture retained, and no token in the text that is
  absent from the raw extraction.'
