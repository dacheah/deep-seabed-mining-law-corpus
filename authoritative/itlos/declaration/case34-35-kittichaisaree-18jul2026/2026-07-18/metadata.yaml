provenance_note: 'SCOPE AND CLASS (maintainer decision 2026-09-16, issue #9): the corpus''s authoritative
  layer holds operative instruments, and that rule is EXTENDED for this ingest to include the judges''
  declarations published with the Orders of 18 July 2026, because a declaration is part of what the Chamber
  published with the decision and is cited in the Order''s own closing lines. This record therefore creates
  the record class ''itlos/declaration/*'' as a SIBLING of ''itlos/order/*'', not a variant of it. Because
  a declaration does not bind the parties and decides nothing, it is recorded as binding_force ''non_binding''
  - a distinction the layer keeps rather than blurs, so nobody cites a declaration as if it disposed of
  the case. ONE INSTRUMENT, TWO CASES: this is the single Kittichaisaree declaration published with the
  two parallel Orders; the two Orders each record that he appends a declaration, and one PDF is published,
  named for both cases, whose text addresses its points generically (''the Applicant'', ''the Parties'').
  It is therefore recorded ONCE, under ''case34-35-'', rather than duplicated per case - the opposite
  of Judge Brown, whose declarations are genuinely two instruments with different text and are recorded
  separately. WHAT THIS DECLARATION SAYS: six numbered paragraphs. It reads the multilateral legal regime
  established under Part XI of the Convention and the 1994 Agreement as the case''s real subject - the
  case tests the practical administration of that institutional architecture; that equilibrium is fundamentally
  compromised if regulatory compliance inquiries are perceived to lack rigorous procedural guarantees,
  which is not a victory of private commercial interests over the global commons but the protection of
  the Applicant''s procedural rights; contractors and their sponsoring States are entitled to have their
  legitimate interests safeguarded, while the relationship between corporate personality, sponsoring State
  control and the integrity of the multilateral legal framework must be preserved; it confronts the Authority''s
  allegation that the Applicant is a wholly owned subsidiary of The Metals Company (another of whose subsidiaries
  was pursuing a domestic licence for seabed exploration); and it closes by observing that in prescribing
  these provisional measures the Chamber reinforces the principle that all actors within the Area are
  bound by the rule of law, expressing the hope that in the merits phase the Authority, the Applicant
  and the sponsoring State will engage so as to vindicate the international community''s ''great expectations''.
  Signed ''Kriangsak Kittichaisaree''. TEXT RECOVERY - NO OCR, DERIVED IN CI UNDER THE PIN: born-digital
  text layer (pdftotext returns the Tribunal''s own characters; no scan, no OCR, no engine disagreement
  to adjudicate). The corpus pins Poppler 22.02.0 (CI runs ubuntu-22.04) while this workstation runs 26.01.0,
  so the text was NOT derived locally: the committed extractor runs in CI under the pin (issue #9, approach
  1) and text_sha256 is the hash CI re-derives. text_fidelity is extracted_verified on two checks: (i)
  wording - every token of the derived text appears IN ORDER in the raw extraction; (ii) content - Tesseract
  5.5.0 over independent 300-dpi renders of both pages returned 100% of its word tokens present in the
  derived text (222 tokens on page 1, 203 on page 2). STRUCTURAL NORMALISATION: masthead absent (a declaration
  carries none), page numbers removed, hard wraps rejoined, the left-margin paragraph numbers folded onto
  their paragraphs, display lines and the signature kept as their own block, curly quotes and apostrophes
  normalised to straight, canonical UTF-8, LF, no BOM, one trailing newline. One residual artefact is
  recorded rather than hidden: paragraph 5 continues across a layout break onto a word opening with a
  capital, so that fragment remains a separate block. original.pdf remains the integrity anchor and original_sha256
  is the hash of the official file itself. NOTE ON AUTHENTIC LANGUAGE: the Orders are ''Done in English
  and in French, both texts being equally authoritative'', but this declaration carries no such clause
  in its published text and no published French version exists; authentic_languages therefore records
  ''en'' only, unlike the Orders.'
