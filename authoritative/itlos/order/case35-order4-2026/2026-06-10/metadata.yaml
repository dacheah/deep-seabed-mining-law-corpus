provenance_note: 'SCOPE (JC-007): ITLOS decisions in proceedings concerning the Area are in scope; party
  pleadings are not. IDENTIFIER (JC-008): case-number based, order decoded as Case <n>, Order No. <m>
  of <year> - here Case No. 35, Order 2026/4, which the instrument states itself in its header and its
  first line. This is the paired order to itlos/order/case34-order3-2026, issued the same day in the parallel
  proceeding brought by the other applicant; the two texts are word-for-word identical apart from the
  case number, the order number and the party name, which is what a diff of the two reconciled texts shows
  and nothing else. WHAT THIS ORDER DOES: it is procedural and short. The President of the Seabed Disputes
  Chamber, having regard to the Request submitted by TOML on 5 June 2026 for the prescription of provisional
  measures under article 290, paragraph 1, of the Convention, and having regard to the Application filed
  on 5 June 2026, FIXES 2 July 2026 as the date for the opening of the oral proceedings and RESERVES the
  subsequent procedure for further decision. No provisional measures are prescribed in it; the measures
  come with the Order of the Chamber of 18 July 2026. TEXT RECOVERY - TWO ENGINES, NOT A VENDOR LAYER.
  The PDF is a scan: each page is one image and the embedded text is an Adobe Acrobat Pro DC 22 Paper
  Capture layer. That layer was NOT adopted: it is a third, unversioned engine, it cannot be re-derived,
  and it is demonstrably wrong in it. The text here is the consensus of Tesseract 5.5.0 (psm 6, oem 3,
  eng) and RapidOCR (rapidocr-onnxruntime 1.4.4 / onnxruntime 1.30.0 / PP-OCRv4 ONNX), both run over the
  same 300-dpi page renders and reconciled by hand against them. Disagreement sites: RapidOCR adopted
  for the Registrar''s given name ''Ximena'' (Tesseract read ''ximene''); Tesseract adopted for the recital
  lines, where RapidOCR dropped tokens and merged lines; and Tesseract''s reading of a scanner edge mark
  as ''|'' at the head of the last recital line was dropped as non-text. Agreement was measured, not asserted:
  99.1% (page 1) and 99.0% (page 2) of characters agree after removing all whitespace, while the naive
  word agreement of 48.1% and 61.6% is an artefact of RapidOCR dropping inter-word spaces in centred display
  lines - both numbers are recorded so they are not confused for one another. ADJUDICATED ON THE PAGE
  AND RETAINED, NOT ''CORRECTED'': this order reads ''Having regard to the Request submitted by TOML Registry
  on 5 June 2026''. The word ''Registry'' is printed on the page (its sibling order reads ''submitted
  by NORI'', with no such word). It is a drafting slip in the instrument and it is reproduced as printed,
  because the corpus records the authentic text rather than the text the maintainer would have written.
  For the same reason ''transmitted to the TOML and the Authority'' keeps its article, which is also on
  the page. NON-TEXT DROPPED: the handwritten signature strokes (Tesseract emitted them as ''Pr 4'', RapidOCR
  omitted them) - signatures are not part of the authentic text, the typed names beneath them are. WHY
  THIS RECORD IS EXCLUDED FROM THE REPRODUCIBILITY GATE: see scripts/repro-policy.json. Reproduction needs
  the OCR toolchain, not committed deterministic code, so the gate cannot re-derive this text; that is
  an honest exclusion, not a coverage gap, and original.pdf with its recorded hash remains the authoritative
  anchor. COVERAGE GAP: the order closes ''Done in English and in French, both texts being equally authoritative''
  (cf. JC-004), so French is an equally authentic text; no French version is published, and it would be
  ingested as this record''s -fr sibling under JC-006 when one appears.'
