provenance_note: 'SCOPE (issue #13, ruled 2026-09-17): sponsoring-State national law. VERSION: this is
  the Attorney General''s Office''s 2020 Revised Edition, Chapter 20.07 - the current consolidation of
  Act 10 of 2014, replacing the 2016 Revised Edition (CAP 46.05) that a first pass had staged. The correction
  came from checking the publisher''s register rather than trusting the copy already in hand, which is
  the annual-review discipline: a file being official does not make it current. WHY THERE IS NO DATE IN
  version_id: the AGO prints the revision year and the chapter number, and no revision date - so the version
  identifier is the edition itself and adoption_date is null (the assent date of the 2014 Act is not stated
  in this edition), rather than inventing either. Commencement, which the edition does state, is 25 August
  2014 (Gazette G 44/2014, cited in its own Endnotes). IDENTIFIER: Act 10 of 2014, the Act''s own number,
  carried in the Endnotes. THE TEXT, AND WHY THIS RECORD READS ITS PDF DIFFERENTLY: this edition typesets
  each section''s number and title as a margin block beside the body. In the default reading order that
  block is interleaved wrongly - section numbers land against the neighbouring section''s title, and the
  Act assembles as if it had 99 sections in a broken sequence. The record therefore reads its PDF with
  layout preserved (pdftotext -layout; the per-record read flag in scripts/extract.py, recorded in this
  record''s attestation as well), which reproduces the printed page and assembles correctly. APPARATUS
  DROPPED: the Arrangement of Sections (a table of contents) and the AGO''s Endnotes, which carry the
  amendment history (Act 10 of 2014, G 44/2014 and the amending instruments). Both are apparatus, not
  operative text, and dropping them means the amendment history is not represented in this record - a
  reader who needs the legislative history must go to the AGO''s Endnotes. THE TEXT: born-digital, no
  OCR. Verified against the edition''s own Arrangement of Sections: 125 sections, contiguous 1-125, zero
  gaps, the text ending at section 125 (Consequential Amendments), no page furniture retained, and no
  token in the text that is absent from the raw extraction.'
